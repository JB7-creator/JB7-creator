name: Generate Contribution Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake animation in electric cyan and gold
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: JB7-creator
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=#00F5FF&color_dots=#0d1117,#0e3a53,#0284C7,#38BDF8,#D4AF37
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#050914,#0e3a53,#0284C7,#38BDF8,#D4AF37
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake animation SVG to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
